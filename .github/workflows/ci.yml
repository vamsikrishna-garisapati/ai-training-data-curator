name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  apify-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install jsonschema

      - name: Validate Apify actor config (official schemas)
        run: python scripts/validate_apify.py

      - name: Verify Apify daily-check prefill path
        run: python scripts/verify_daily_check.py

  test:
    runs-on: ubuntu-latest
    needs: apify-validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: apify-validate
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-training-data-curator .

      - name: Smoke test container imports
        run: |
          docker run --rm ai-training-data-curator python -c "
          import apify, crawlee, trafilatura
          from src.main import main
          print('container imports OK')
          "
